spring.application.name=MatchService
server.port=8082

# Base de datos H2 persistente en un archivo local
spring.datasource.url=jdbc:h2:file:./data/betesp_matches;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Crear o actualizar las tablas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2 (solo desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Authentication
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

jwt.secret=${JWT_SECRET}
football-data.base-url=https://api.football-data.org/v4
football-data.api-key=${FOOTBALL_DATA_API_KEY
settlement-service.base-url=http://localhost:8085
settlement-service.finished-matches-path=/internal/settlement/matches/{matchId}/finished

match.scheduler.fixed-delay-ms=300000