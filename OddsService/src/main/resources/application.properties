spring.application.name=OddsService
server.port=8083

# Base de datos H2 persistente en un archivo local
spring.datasource.url=jdbc:h2:file:./data/betesp_odds;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Crear o actualizar las tablas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2 (solo desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Authentication
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

jwt.secret=${JWT_SECRET}

# Match Service
match-service.base-url=http://localhost:8082
match-service.matches-path=/matches

# Rec�lculo cada 5 minutos
odds.scheduler.fixed-delay-ms=300000

# Par�metros del modelo inicial
odds.model.home-advantage=60
odds.model.margin=0.06