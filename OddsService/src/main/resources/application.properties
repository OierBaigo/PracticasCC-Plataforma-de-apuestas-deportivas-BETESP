spring.application.name=OddsService
server.port=8083

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/betesp_odds}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health

# Crear o actualizar las tablas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Authentication
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

jwt.secret=${JWT_SECRET}

# Match Service
match-service.base-url=http://matchservice:8082
match-service.matches-path=/matches
match-service.matches-sync-status-path=/matches/internal/sync-status

# Rec�lculo cada 5 minutos
odds.scheduler.fixed-delay-ms=300000

# Par�metros del modelo inicial
odds.model.home-advantage=60
odds.model.margin=0.06