spring.application.name=BetsService
server.port=8084

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/betesp_bets}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health

# Crear o actualizar las tablas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Authentication
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

jwt.secret=${JWT_SECRET}

match-service.base-url=http://matchservice:8082
odds-service.base-url=http://oddsservice:8083
user-service.base-url=http://userservice:8081

user-service.balance-path=/user/me/balance
user-service.withdraw-path=/user/me/withdraw