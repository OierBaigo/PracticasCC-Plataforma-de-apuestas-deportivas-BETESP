name: BETESP CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: UserService
            database: betesp_users
          - service: MatchService
            database: betesp_matches
          - service: OddsService
            database: betesp_odds
          - service: BetsService
            database: betesp_bets
          - service: SettlementService
            database: betesp_settlements

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: betesp
          POSTGRES_PASSWORD: betesp_ci_password
          POSTGRES_DB: ${{ matrix.database }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U betesp -d ${{ matrix.database }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ matrix.database }}
      SPRING_DATASOURCE_USERNAME: betesp
      SPRING_DATASOURCE_PASSWORD: betesp_ci_password
      JWT_SECRET: YmV0ZXNwLWNpLXRlc3Qtc2VjcmV0LWtleS1mb3ItZ2l0aHViLWFjdGlvbnMtMjAyNg==
      FOOTBALL_DATA_API_KEY: "valor-de-prueba-para-ci"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Give permission to Maven Wrapper
        run: chmod +x mvnw
        working-directory: ${{ matrix.service }}

      - name: Build and run tests
        run: ./mvnw -B clean verify
        working-directory: ${{ matrix.service }}
  
  lint:
    name: Lint ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - UserService
          - MatchService
          - OddsService
          - BetsService
          - SettlementService

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Run Checkstyle
        run: |
          chmod +x mvnw
          ./mvnw -B validate
        working-directory: ${{ matrix.service }}

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.service }}/Dockerfile
          failure-threshold: warning
  
  
  publish:
    name: Build and publish ${{ matrix.image }}
    runs-on: ubuntu-latest

    needs:
      - build-and-test
      - lint

    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: UserService
            image: betesp-user-service
          - service: MatchService
            image: betesp-match-service
          - service: OddsService
            image: betesp-odds-service
          - service: BetsService
            image: betesp-bets-service
          - service: SettlementService
            image: betesp-settlement-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/oierbaigo/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
