name: BETESP CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: UserService
            database: betesp_users
          - service: MatchService
            database: betesp_matches
          - service: OddsService
            database: betesp_odds
          - service: BetsService
            database: betesp_bets
          - service: SettlementService
            database: betesp_settlements

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: betesp
          POSTGRES_PASSWORD: betesp_ci_password
          POSTGRES_DB: ${{ matrix.database }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U betesp -d ${{ matrix.database }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ matrix.database }}
      SPRING_DATASOURCE_USERNAME: betesp
      SPRING_DATASOURCE_PASSWORD: betesp_ci_password
      JWT_SECRET: YmV0ZXNwLWNpLXRlc3Qtc2VjcmV0LWtleS1mb3ItZ2l0aHViLWFjdGlvbnMtMjAyNg==
      FOOTBALL_DATA_API_KEY: "valor-de-prueba-para-ci"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Give permission to Maven Wrapper
        run: chmod +x mvnw
        working-directory: ${{ matrix.service }}

      - name: Build and run tests
        run: ./mvnw -B clean verify
        working-directory: ${{ matrix.service }}