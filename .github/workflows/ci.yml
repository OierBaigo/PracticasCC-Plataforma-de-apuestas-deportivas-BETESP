name: BETESP CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and test microservices
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - UserService
          - MatchService
          - OddsService
          - BetsService
          - SettlementService

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Give permission to Maven Wrapper
        run: chmod +x mvnw
        working-directory: ${{ matrix.service }}

      - name: Build and run tests
        run: ./mvnw -B clean verify
        working-directory: ${{ matrix.service }}