spring.application.name=SettlementService
server.port=8085

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health

# Authentication
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

jwt.secret=${JWT_SECRET}

bet-service.base-url=http://betsservice:8084
bet-service.bets-path=/bets/internal/match/{matchId}

user-service.base-url=http://userservice:8081
user-service.deposit-path=/user/internal/{userId}/deposit